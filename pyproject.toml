[tool.uv]
package = false

[project]
name = "export-viewer-service"
version = "0.1.0"
description = "Orquestador público: llama al extractor y al CRUD"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.34",
    "httpx>=0.28,<0.29",
    "pydantic-settings>=2.6,<3.0",
    "python-json-logger>=3.2,<4.0",
    "python-multipart>=0.0.18,<0.1",
    "redis>=5.0,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.28,<0.29",
    "respx>=0.21,<0.22",
    "ruff>=0.8,<0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
