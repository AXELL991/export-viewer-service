# docker-compose.yml del export-viewer-service (orquestador).
# Los tres microservicios viven como carpetas hermanas:
#   ../export-viewer-service  (aqui)
#   ../pdf-extractor-service
#   ../document-crud-service
#
# Usar: cd export-viewer-service && docker compose up --build -d

name: pdf_extractor

services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-mongouser}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-mongopassword}
      MONGO_INITDB_DATABASE: document_crud_db
    volumes:
      - mongo-data:/data/db
    networks:
      - interna
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_ROOT_USER:-mongouser}", "-p", "${MONGO_ROOT_PASS:-mongopassword}", "--authenticationDatabase", "admin", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # No se publica el puerto: solo accesible desde la red interna.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  document-crud-service:
    build:
      context: ../document-crud-service
      dockerfile: Dockerfile
    container_name: document-crud-service
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-mongouser}:${MONGO_ROOT_PASS:-mongopassword}@mongo:27017/document_crud_db?authSource=admin
      MONGO_DB_NAME: document_crud_db
      MONGO_TIMEOUT_MS: 5000
      LOGLEVEL: info
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      MAX_TEXT_BYTES: 15728640
      PAGE_SIZE_MAX: 100
    networks:
      - interna
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  pdf-extractor-service:
    build:
      context: ../pdf-extractor-service
      dockerfile: Dockerfile
    container_name: pdf-extractor-service
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      LOGLEVEL: info
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      MAX_FILE_SIZE_MB: 10
      MAX_PAGES: 500
      EXTRACT_TIMEOUT_SECONDS: 60
      WORKER_POOL_SIZE: 2
      QUEUE_MAXSIZE: 10
    networks:
      - interna
    # Stateless: no depende de mongo.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  export-viewer-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: export-viewer-service
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      EXTRACTOR_URL: http://pdf-extractor-service:8000
      CRUD_URL: http://document-crud-service:8000
      CONNECT_TIMEOUT: 5
      EXTRACTOR_READ_TIMEOUT: 60
      CRUD_READ_TIMEOUT: 5
      RETRY_ATTEMPTS: 3
      RETRY_BACKOFF_BASE: 0.5
      CIRCUIT_BREAKER_FAILURES: 5
      CIRCUIT_BREAKER_RECOVERY: 30
      RATE_LIMIT_MAX: 60
      RATE_LIMIT_WINDOW: 60
      TRUSTED_PROXY: false
      MAX_FILE_SIZE_MB: 10
      LOGLEVEL: info
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      PUBLIC_PORT: ${PUBLIC_PORT:-8000}
    networks:
      - interna
    ports:
      - "${PUBLIC_PORT:-8000}:8000"
    depends_on:
      pdf-extractor-service:
        condition: service_healthy
      document-crud-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  interna:
    driver: bridge

volumes:
  mongo-data:
