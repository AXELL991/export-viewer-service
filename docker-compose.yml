# docker-compose.yml del export-viewer-service (orquestador).
# Los tres microservicios viven como carpetas hermanas:
#   ../export-viewer-service  (aqui)
#   ../pdf-extractor-service
#   ../document-crud-service
#
# Usar: cd export-viewer-service && docker compose up --build -d

name: pdf_extractor

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
      - --api.insecure=true
      - --api.dashboard=true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ../traefik-proxy/certs:/etc/certs:ro
    networks:
      - pdf-extractor-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    labels:
      - "traefik.enable=true"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --save 60 1 --maxmemory-policy allkeys-lru
    networks:
      - pdf-extractor-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    labels:
      - "traefik.enable=false"

  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-mongouser}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-mongopassword}
      MONGO_INITDB_DATABASE: document_crud_db
    volumes:
      - mongo-data:/data/db
    networks:
      - pdf-extractor-network
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_ROOT_USER:-mongouser}", "-p", "${MONGO_ROOT_PASS:-mongopassword}", "--authenticationDatabase", "admin", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 512M
    labels:
      - "traefik.enable=false"

  document-crud-service:
    build:
      context: ../document-crud-service
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-mongouser}:${MONGO_ROOT_PASS:-mongopassword}@mongo:27017/document_crud_db?authSource=admin
      MONGO_DB_NAME: document_crud_db
      MONGO_TIMEOUT_MS: 5000
      LOGLEVEL: info
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-insecure-dev-token-cambiar-en-produccion}
      MAX_TEXT_BYTES: 15728640
      PAGE_SIZE_MAX: 100
    networks:
      - pdf-extractor-network
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.document-crud.rule=PathPrefix(`/v1/documents`)"
      - "traefik.http.routers.document-crud.entrypoints=web"
      - "traefik.http.services.document-crud.loadbalancer.server.port=8000"

  pdf-extractor-service:
    build:
      context: ../pdf-extractor-service
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      LOGLEVEL: info
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-insecure-dev-token-cambiar-en-produccion}
      MAX_FILE_SIZE_MB: 10
      MAX_PAGES: 500
      EXTRACT_TIMEOUT_SECONDS: 60
      WORKER_POOL_SIZE: 2
      QUEUE_MAXSIZE: 10
    networks:
      - pdf-extractor-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2"
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pdf-extractor.rule=PathPrefix(`/v1/extract`)"
      - "traefik.http.routers.pdf-extractor.entrypoints=web"
      - "traefik.http.services.pdf-extractor.loadbalancer.server.port=8000"

  export-viewer-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      EXTRACTOR_URL: http://pdf-extractor-service:8000
      CRUD_URL: http://document-crud-service:8000
      REDIS_URL: redis://redis:6379/0
      CONNECT_TIMEOUT: 5
      EXTRACTOR_READ_TIMEOUT: 60
      CRUD_READ_TIMEOUT: 5
      RETRY_ATTEMPTS: 3
      RETRY_BACKOFF_BASE: 0.5
      CIRCUIT_BREAKER_FAILURES: 5
      CIRCUIT_BREAKER_RECOVERY: 30
      RATE_LIMIT_MAX: 60
      RATE_LIMIT_WINDOW: 60
      TRUSTED_PROXY: false
      MAX_FILE_SIZE_MB: 10
      LOGLEVEL: info
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-insecure-dev-token-cambiar-en-produccion}
      PUBLIC_PORT: ${PUBLIC_PORT:-8000}
    networks:
      - pdf-extractor-network
    depends_on:
      pdf-extractor-service:
        condition: service_healthy
      document-crud-service:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.export-viewer.rule=Host(`localhost`)"
      - "traefik.http.routers.export-viewer.entrypoints=web"
      - "traefik.http.services.export-viewer.loadbalancer.server.port=8000"

networks:
  pdf-extractor-network:
    driver: bridge

volumes:
  mongo-data:
