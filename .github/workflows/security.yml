name: Security - SCA and container scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

jobs:
  python-sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.6.12"
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: pip-audit
        run: uv run pip-audit --desc on || true
      - name: safety
        run: uv run safety scan || true

  container-sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t export-viewer-service:ci -f Dockerfile .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image: "export-viewer-service:ci"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
