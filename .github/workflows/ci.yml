name: CI - export-viewer-service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.5"
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Ejecutar ruff (lint)
        run: uv run ruff check app/ tests/
      - name: Ejecutar pytest
        run: uv run pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t export-viewer-service:ci .
