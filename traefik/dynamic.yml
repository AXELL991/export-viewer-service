http:
  routers:
    # API pública - Orquestador (UI y endpoints) por HTTP
    export-viewer:
      rule: "Host(`extract.universidad.localhost`)"
      service: "export-viewer"
      entryPoints:
        - "web"
      middlewares:
        - "rate-limit"
        - "circuit-breaker"

    # Dashboard de Traefik (HTTP)
    traefik-dashboard:
      rule: "Host(`traefik.extract.universidad.localhost`)"
      service: "api@internal"
      entryPoints:
        - "web"

  middlewares:
    rate-limit:
      ratelimit:
        average: 100
        burst: 50
        period: 60s

    circuit-breaker:
      circuitbreaker:
        expression: "NetworkErrorRatio() > 0.30 || ResponseCodeRatio(500, 600, 0, 600) > 0.25"
        checkPeriod: 10s
        recoveryDuration: 30s
        fallbackDuration: 30s

  services:
    export-viewer:
      loadBalancer:
        servers:
          - url: "http://export-viewer-service:8000"

tls:
  certificates:
    - certFile: "/etc/certs/cert.pem"
      keyFile: "/etc/certs/key.pem"