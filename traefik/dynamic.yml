http:
  routers:
    # API pública - Orquestador (UI y endpoints) por HTTP
    export-viewer:
      rule: "Host(`pdf-extractor.local`)"
      service: "export-viewer"
      entryPoints:
        - "web"

    # Dashboard de Traefik (HTTP)
    traefik-dashboard:
      rule: "Host(`extract.universidad.localhost`)"
      service: "api@internal"
      entryPoints:
        - "web"

  services:
    export-viewer:
      loadBalancer:
        servers:
          - url: "http://export-viewer-service:8000"

tls:
  certificates:
    - certFile: "/etc/certs/cert.pem"
      keyFile: "/etc/certs/key.pem"
