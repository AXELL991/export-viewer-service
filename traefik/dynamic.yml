http:
  routers:
    # Dashboard de Traefik (solo HTTP local)
    traefik-dashboard:
      rule: "Host(`localhost`)"
      service: "api@internal"
      entryPoints:
        - "traefik"

    # API pública - Orquestador (UI y endpoints) con HTTPS
    export-viewer:
      rule: "Host(`localhost`)"
      service: "export-viewer"
      entryPoints:
        - "websecure"
      tls: {}

    # Servicio CRUD de documentos con HTTPS
    document-crud:
      rule: "PathPrefix(`/v1/documents`)"
      service: "document-crud"
      entryPoints:
        - "websecure"
      tls: {}

    # Servicio extractor de PDF con HTTPS
    pdf-extractor:
      rule: "PathPrefix(`/v1/extract`)"
      service: "pdf-extractor"
      entryPoints:
        - "websecure"
      tls: {}

  services:
    export-viewer:
      loadBalancer:
        servers:
          - url: "http://export-viewer-service:8000"

    document-crud:
      loadBalancer:
        servers:
          - url: "http://document-crud-service:8000"

    pdf-extractor:
      loadBalancer:
        servers:
          - url: "http://pdf-extractor-service:8000"

tls:
  certificates:
    - certFile: "/etc/certs/cert.pem"
      keyFile: "/etc/certs/key.pem"
